name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Install, build, lint, migrate and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: barrah_ci
          MYSQL_USER: barrah
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, exif
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # The repository does not commit lockfiles yet. When they are missing,
      # dependencies are resolved here and the generated lockfiles are uploaded
      # as artifacts so they can be reviewed and committed.
      - name: Install Composer dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Upload lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles
          path: |
            composer.lock
            package-lock.json
          retention-days: 14

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build frontend assets
        run: npm run build

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Migrate and seed MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: barrah_ci
          DB_USERNAME: barrah
          DB_PASSWORD: ci-password
          # Exercise the order lifecycle (transactions and row locks) on MySQL.
          DEMO_SEED: "true"
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      # phpunit.xml runs the suite on in-memory SQLite.
      - name: Run tests
        run: php artisan test

      # Runs after tests so a newly published advisory does not hide build or
      # test results. Still a failing gate.
      - name: Audit Composer dependencies
        run: composer audit

  docker:
    name: Docker build and smoke test
    needs: laravel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build from the lockfiles generated by the laravel job, so the image
      # uses the same dependency versions that passed the tests.
      - name: Download lockfiles from laravel job
        uses: actions/download-artifact@v4
        with:
          name: lockfiles
          path: .

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sirdadfar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The network is internal: the containers have no route to the
      # internet, which shows the application needs no external servers.
      - name: Start MySQL
        run: |
          docker network create --internal sirdadfar-ci
          docker run -d --name sirdadfar-mysql --network sirdadfar-ci \
            -e MYSQL_DATABASE=barrah \
            -e MYSQL_USER=barrah \
            -e MYSQL_PASSWORD=ci-password \
            -e MYSQL_ROOT_PASSWORD=ci-root-password \
            mysql:8.4 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

      - name: Start application
        run: |
          docker run -d --name sirdadfar-app --network sirdadfar-ci \
            -e APP_NAME="بارراه" \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://127.0.0.1:8080 \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=sirdadfar-mysql \
            -e DB_PORT=3306 \
            -e DB_DATABASE=barrah \
            -e DB_USERNAME=barrah \
            -e DB_PASSWORD=ci-password \
            -e SESSION_DRIVER=database \
            -e CACHE_STORE=database \
            -e QUEUE_CONNECTION=database \
            -e DB_WAIT_TIMEOUT=180 \
            -e RUN_MIGRATIONS=true \
            -e RUN_SEEDERS=true \
            -e ADMIN_MOBILE=09000000000 \
            -e ADMIN_PASSWORD=ci-admin-password \
            sirdadfar:ci

      - name: Smoke test
        run: |
          check() {
            url="http://127.0.0.1:8080$1"
            for i in $(seq 1 60); do
              if docker exec sirdadfar-app wget -q -O /dev/null "$url"; then
                echo "OK $url (attempt $i)"
                return 0
              fi
              echo "Waiting for $url (attempt $i)"
              sleep 3
            done
            echo "FAILED $url"
            return 1
          }
          check /up
          check /
          check /admin/login
          check /login
          check /robots.txt
          check /sitemap.xml

          # Assets are served by the container itself (Vite build with the
          # local Vazirmatn font), never from a CDN or a font service.
          docker exec sirdadfar-app wget -q -O - http://127.0.0.1:8080/ > home.html
          grep -q '/build/assets/' home.html
          if grep -Eq 'fonts\.googleapis|fonts\.gstatic|fonts\.bunny|cdn\.jsdelivr|unpkg\.com|cdnjs' home.html; then
            echo "External asset host found in the home page"
            exit 1
          fi

          # Queue worker and scheduler run under supervisor.
          docker exec sirdadfar-app ps > processes.txt
          grep -q 'queue:work' processes.txt
          grep -q 'schedule:work' processes.txt

          # Base data and the admin account were seeded.
          docker exec sirdadfar-mysql mysql -ubarrah -pci-password barrah -N \
            -e "SELECT COUNT(*) FROM provinces; SELECT COUNT(*) FROM vehicle_types; SELECT COUNT(*) FROM users WHERE role = 'admin';" | tee counts.txt
          if grep -qx '0' counts.txt; then
            echo "Seeding did not run"
            exit 1
          fi

      - name: Wait for the Docker health check
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sirdadfar-app)
            echo "Health: $status (attempt $i)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs sirdadfar-app || true
          docker logs sirdadfar-mysql || true

      - name: Stop containers
        if: always()
        run: |
          docker rm -f sirdadfar-app sirdadfar-mysql || true
          docker network rm sirdadfar-ci || true
