; Loaded after the image's zz-docker.conf, so these values win.

[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000

; Keep the container environment (DB_*, APP_KEY, ...) visible to PHP.
clear_env = no

pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; nginx already writes the access log.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
