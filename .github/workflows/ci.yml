name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Install, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            echo "lockfile=existing" >> "$GITHUB_OUTPUT"
            npm ci --no-audit --no-fund
          else
            echo "lockfile=generated" >> "$GITHUB_OUTPUT"
            npm install --no-audit --no-fund
          fi

      # The docker job builds from this exact lockfile, so the image uses the
      # same dependency tree that passed lint, typecheck and build. When the
      # lockfile was generated, download this artifact and commit it.
      - name: Upload package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  docker:
    name: Docker build and smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package-lock.json from build job
        uses: actions/download-artifact@v4
        with:
          name: package-lock
          path: .

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sirdadfar-saas-starter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name sirdadfar-ci -p 3000:3000 sirdadfar-saas-starter:ci

      - name: Smoke test
        run: |
          check() {
            url="$1"
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ]; then
                echo "OK $url (attempt $i)"
                return 0
              fi
              echo "Waiting for $url (attempt $i, status $code)"
              sleep 2
            done
            echo "FAILED $url"
            return 1
          }
          check http://localhost:3000/
          check http://localhost:3000/orders

      - name: Container logs on failure
        if: failure()
        run: docker logs sirdadfar-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f sirdadfar-ci || true
