; Production PHP settings for the freight platform container.

expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_vars = 3000
date.timezone = Asia/Tehran

; Driver documents are limited by FREIGHT_DOCUMENT_MAX_KB (default 5120 KB,
; see config/freight.php). These limits leave some headroom for the form
; data. If you raise FREIGHT_DOCUMENT_MAX_KB, raise these values and
; client_max_body_size in docker/nginx.conf as well.
upload_max_filesize = 6M
post_max_size = 8M

; Code inside the image never changes, so timestamps are not checked.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
