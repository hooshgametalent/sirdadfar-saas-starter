# Production stack: the application container (nginx, PHP-FPM, queue worker
# and scheduler) and MySQL 8.4. Nothing else is required at runtime.
#
# Values come from .env next to this file. Create it from .env.example (or
# let deploy.sh do it) and set APP_KEY, DB_PASSWORD and DB_ROOT_PASSWORD.

name: sirdadfar

services:
  app:
    build:
      context: .
      # Optional mirrors, used only while building the image.
      args:
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: sirdadfar-saas-starter:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      # Application logs go to `docker compose logs app`.
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      # Sessions, cache files, logs and the private driver documents.
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-barrah}
      MYSQL_USER: ${DB_USERNAME:-barrah}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  app-storage:
  mysql-data:
